<!doctype html>
<html lang="es">
  <head>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-XXXXXXX");
    </script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Soluciones Web - E-Commerce</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- Offcanvas Side Cart -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-drawer" id="cartDrawer">
      <div class="cart-drawer-header">
        <h3><i class="fa-solid fa-bag-shopping"></i> Tu Carrito</h3>
        <button class="close-cart-btn" id="closeCartBtn">&times;</button>
      </div>
      <div class="cart-drawer-body" id="cartDrawerBody">
        <p class="empty-cart-msg">El carrito está vacío</p>
      </div>
      <div class="cart-drawer-footer">
        <div class="cart-subtotal">
          <span>Subtotal:</span>
          <span id="cartSubtotalAmount">$0,00</span>
        </div>
        <button class="checkout-btn" disabled>Finalizar Compra</button>
      </div>
    </aside>

    <!-- Modal Vista Rápida -->
    <div class="modal-overlay" id="productModalOverlay">
      <div class="product-modal">
        <button class="close-modal-btn" id="closeModalBtn">&times;</button>
        <div class="modal-body" id="modalProductContent"></div>
      </div>
    </div>
  </body>
</html>
